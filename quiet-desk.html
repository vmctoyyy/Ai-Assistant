<title>Quiet Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F3F0;
  --surface:#FBFCFA;
  --surface-2:#E8ECE7;
  --ink:#232927;
  --ink-2:#5C6663;
  --ink-3:#8B9591;
  --line:#DCE0DA;
  --line-2:#C7CEC6;
  --accent:#3D6E60;
  --accent-soft:#E0EAE5;
  --up:#4A7C64;
  --down:#9C6A5B;
  --tap:52px;
  --wrap:34rem;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131614;
    --surface:#1A1E1C;
    --surface-2:#222826;
    --ink:#E7EAE6;
    --ink-2:#A3ACA7;
    --ink-3:#79837E;
    --line:#2A302D;
    --line-2:#39413D;
    --accent:#84B7A4;
    --accent-soft:#1F2C27;
    --up:#86B99C;
    --down:#C49485;
  }
}
:root[data-theme="dark"]{
  --ground:#131614;
  --surface:#1A1E1C;
  --surface-2:#222826;
  --ink:#E7EAE6;
  --ink-2:#A3ACA7;
  --ink-3:#79837E;
  --line:#2A302D;
  --line-2:#39413D;
  --accent:#84B7A4;
  --accent-soft:#1F2C27;
  --up:#86B99C;
  --down:#C49485;
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

.page{
  max-width:var(--wrap);
  margin:0 auto;
  padding:2.25rem 1.125rem calc(7.5rem + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  gap:2.75rem;
}

/* ---- header ---- */
.head{display:flex;flex-direction:column;gap:.15rem}
.head .wd{
  font-family:var(--sans);font-size:.75rem;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.head .dt{
  font-family:var(--serif);font-size:2.125rem;font-weight:400;
  letter-spacing:-.01em;line-height:1.15;text-wrap:balance;
}

/* ---- section scaffolding ---- */
.sec{display:flex;flex-direction:column;gap:.875rem}
.eyebrow{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  font-size:.6875rem;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);
  padding-bottom:.5rem;border-bottom:1px solid var(--line);
}
.eyebrow .hint{font-weight:400;letter-spacing:.06em;text-transform:none;font-size:.75rem}

/* ---- top 3 ---- */
.top3{display:flex;flex-direction:column;gap:.5rem}
.slot{
  display:flex;align-items:center;gap:.875rem;
  min-height:76px;padding:.75rem .875rem;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  transition:background .15s ease,border-color .15s ease;
}
.slot.empty{background:transparent;border-style:dashed;border-color:var(--line-2)}
.slot .body{flex:1;min-width:0;text-align:left}
.slot .txt{
  font-family:var(--serif);font-size:1.1875rem;line-height:1.3;
  overflow-wrap:anywhere;
}
.slot.done .txt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.slot .prompt{color:var(--ink-3);font-size:.9375rem;font-style:italic;font-family:var(--serif)}
.slot .rank{
  font-family:var(--mono);font-size:.6875rem;color:var(--ink-3);
  width:1ch;flex:none;
}

/* ---- check control ---- */
.check{
  flex:none;width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--line-2);
  display:grid;place-items:center;
  transition:border-color .15s ease,background .15s ease;
}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{opacity:0;color:var(--surface)}
.check.on svg{opacity:1}
.check.on svg{color:var(--ground)}
.tapzone{
  display:flex;align-items:center;gap:.875rem;flex:1;min-width:0;
  text-align:left;min-height:var(--tap);
}

/* ---- task list ---- */
.tasks{display:flex;flex-direction:column}
.rowwrap{position:relative;overflow:hidden}
.rowwrap::after{
  content:"Delete";position:absolute;inset:0 1rem 0 auto;
  display:flex;align-items:center;
  font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--down);opacity:0;pointer-events:none;
}
.rowwrap.sliding::after{opacity:1}
.row{
  position:relative;background:var(--ground);
  display:flex;align-items:center;gap:.75rem;
  padding:.5rem 0;border-bottom:1px solid var(--line);
  touch-action:pan-y;
}
.row .txt{font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.row.done .txt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.iconbtn{
  flex:none;width:40px;height:40px;border-radius:8px;
  display:grid;place-items:center;color:var(--ink-3);
  transition:color .15s ease,background .15s ease;
}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.empty-note{
  color:var(--ink-3);font-family:var(--serif);font-style:italic;
  font-size:.9375rem;padding:.75rem 0;
}
.tally{
  font-size:.8125rem;color:var(--ink-3);padding-top:.75rem;
  font-variant-numeric:tabular-nums;
}

/* ---- schedule ---- */
.evrow{
  display:flex;align-items:flex-start;gap:.875rem;
  padding:.6875rem 0;border-bottom:1px solid var(--line);
}
.evrow .t{
  font-family:var(--mono);font-size:.875rem;font-variant-numeric:tabular-nums;
  color:var(--ink-2);padding-top:.1rem;width:4.25em;flex:none;
}
.evrow .ti{flex:1;min-width:0;overflow-wrap:anywhere}
.evrow.past{opacity:.42}
.evrow.next .t{color:var(--accent);font-weight:500}
.nextpill{
  display:inline-block;margin-left:.5rem;font-size:.625rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  vertical-align:.1em;
}
.addrow{display:flex;gap:.5rem;align-items:center;padding-top:.875rem}
.field{
  background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:.6875rem .75rem;min-height:46px;
  width:100%;
}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:none;border-color:var(--accent)}
.field.time{width:7.25em;flex:none;font-family:var(--mono);font-size:.9375rem}
.composer .field,.addrow .field{flex:1;min-width:0}
.btn{
  border:1px solid var(--line-2);border-radius:10px;
  padding:.625rem 1rem;min-height:46px;font-size:.875rem;font-weight:500;
  color:var(--ink-2);white-space:nowrap;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{
  background:var(--accent);border-color:var(--accent);
  color:var(--ground);font-weight:600;
}
.btn.primary:hover{opacity:.9;color:var(--ground)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line-2);color:var(--ink-2)}

/* ---- habits ---- */
.habit{
  display:flex;align-items:center;gap:.875rem;
  padding:.5rem 0;border-bottom:1px solid var(--line);
  min-height:var(--tap);
}
.habit .name{flex:1;min-width:0;font-size:.9375rem;text-align:left}
.habit .name em{
  display:block;font-style:normal;font-size:.75rem;color:var(--ink-3);
  margin-top:.05rem;
}
.dots{display:flex;gap:5px;align-items:center;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dot.on{background:var(--accent)}
.dot.today{box-shadow:0 0 0 2px var(--ground),0 0 0 3px var(--line-2)}
.dot.today.on{box-shadow:0 0 0 2px var(--ground),0 0 0 3px var(--accent)}

/* ---- markets ---- */
.disc{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  width:100%;min-height:var(--tap);text-align:left;
}
.disc .lbl{font-size:.9375rem}
.disc .meta{font-size:.75rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chev{color:var(--ink-3);transition:transform .18s ease;flex:none}
.chev.open{transform:rotate(180deg)}
.mkt{
  display:grid;grid-template-columns:1fr 5.75em 4.75em;
  gap:.5rem;align-items:center;
  padding:.4375rem 0;border-bottom:1px solid var(--line);
}
.mkt .nm{min-width:0;font-size:.9375rem}
.mkt .nm em{
  display:block;font-style:normal;font-family:var(--mono);
  font-size:.6875rem;color:var(--ink-3);letter-spacing:.04em;
}
.mkt input{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:.5rem .125rem;min-height:42px;text-align:right;
  font-family:var(--mono);font-size:.875rem;font-variant-numeric:tabular-nums;
}
.mkt input:focus{outline:none;border-bottom-color:var(--accent)}
.mkt input::placeholder{color:var(--ink-3);opacity:.55}
.mkt .chg{position:relative;display:flex;align-items:center}
.mkt .chg input{padding-right:1.1em}
.mkt .chg::after{
  content:"%";position:absolute;right:.125rem;
  font-family:var(--mono);font-size:.8125rem;color:var(--ink-3);
  pointer-events:none;
}
.mkt .chg.up input{color:var(--up)}
.mkt .chg.down input{color:var(--down)}
.mktfoot{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:1rem}

/* ---- composer ---- */
.composer{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--ground);
  border-top:1px solid var(--line);
  padding:.625rem 1.125rem calc(.625rem + env(safe-area-inset-bottom,0px));
}
.composer .inner{
  max-width:var(--wrap);margin:0 auto;display:flex;gap:.5rem;align-items:center;
}

/* ---- sheet ---- */
.scrim{
  position:fixed;inset:0;z-index:40;background:rgba(12,16,14,.42);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--ground);width:100%;max-width:var(--wrap);
  border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:1.25rem 1.125rem calc(1.25rem + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:.875rem;
  max-height:88vh;
}
.sheet h2{
  margin:0;font-family:var(--serif);font-size:1.375rem;font-weight:400;
}
.sheet p{margin:0;font-size:.875rem;color:var(--ink-2)}
.sheet textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:.875rem;min-height:38vh;resize:none;line-height:1.6;width:100%;
}
.sheet textarea:focus{outline:none;border-color:var(--accent)}
.sheetfoot{display:flex;gap:.5rem;justify-content:flex-end}

/* ---- footer / settings ---- */
.foot{
  display:flex;flex-direction:column;gap:.625rem;
  padding-top:1.5rem;border-top:1px solid var(--line);
}
.foot .note{font-size:.75rem;color:var(--ink-3);line-height:1.55}
.linkbtn{
  align-self:flex-start;font-size:.8125rem;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--line-2);min-height:44px;
}
.linkbtn:hover{color:var(--down);text-decoration-color:var(--down)}
.linkbtn.armed{color:var(--down);text-decoration-color:var(--down)}

/* ---- states ---- */
.banner{
  background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  padding:.75rem .875rem;font-size:.8125rem;color:var(--ink-2);line-height:1.5;
}
.skel{display:flex;flex-direction:column;gap:.75rem}
.skel i{
  display:block;border-radius:4px;background:var(--surface-2);
  animation:pulse 1.6s ease-in-out infinite;
}
.skel .line{height:14px;width:100%}
.skel .line:nth-child(2){width:70%;animation-delay:.12s}
.skel .line:nth-child(3){width:45%;animation-delay:.24s}
.skel .big{height:70px;border-radius:12px;width:100%}
.skel .big:nth-child(2){animation-delay:.12s}
.skel .big:nth-child(3){animation-delay:.24s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.loadwrap{
  max-width:var(--wrap);margin:0 auto;padding:2.25rem 1.125rem;
  display:flex;flex-direction:column;gap:2rem;
}
.sr{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;
}
</style>

<script>
(function () {
  "use strict";

  var h = React.createElement;
  var useState = React.useState, useEffect = React.useEffect,
      useRef = React.useRef, useMemo = React.useMemo, useCallback = React.useCallback;

  function tag(name) { return function (props) {
    var kids = Array.prototype.slice.call(arguments, 1);
    return React.createElement.apply(null, [name, props].concat(kids));
  }; }
  var div = tag("div"), span = tag("span"), button = tag("button"), input = tag("input"),
      section = tag("section"), header = tag("header"), p = tag("p"), h2 = tag("h2"),
      textarea = tag("textarea"), label = tag("label"), footer = tag("footer");

  /* ---------- icons ---------- */
  function icon(d, size) {
    return h("svg", {
      width: size || 18, height: size || 18, viewBox: "0 0 24 24", fill: "none",
      stroke: "currentColor", strokeWidth: 1.75, strokeLinecap: "round",
      strokeLinejoin: "round", "aria-hidden": "true"

  }
  var I_CHECK = "M5 12.5l4.5 4.5L19 7";
  var I_X = "M6 6l12 12M18 6L6 18";
  var I_UP = "M12 19V5M6 11l6-6 6 6";
  var I_DOWN = "M12 5v14M18 13l-6 6-6-6";
  var I_PLUS = "M12 5v14M5 12h14";
  var I_CHEV = "M6 9l6 6 6-6";

  /* ---------- dates ---------- */
  var WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var WD3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MO3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function dayKey(d) {
    var m = d.getMonth() + 1, dd = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (dd < 10 ? "0" + dd : dd);
  }
  function todayKey() { return dayKey(new Date()); }
  function nzDate(d) { return WD3[d.getDay()] + " " + d.getDate() + " " + MO3[d.getMonth()]; }
  function shiftKey(key, delta) {
    var parts = key.split("-");
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    d.setDate(d.getDate() + delta);
    return dayKey(d);
  }
  function keyToDate(key) {
    var parts = key.split("-");
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }
  function nowMinutes() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function timeToMinutes(t) {
    if (!t) return 0;
    var bits = String(t).split(":");
    return (+bits[0] || 0) * 60 + (+bits[1] || 0);
  }
  function staleness(iso) {
    if (!iso) return "not entered yet";
    var then = new Date(iso).getTime();
    if (isNaN(then)) return "not entered yet";
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return "updated just now";
    if (mins < 60) return "updated " + mins + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return "updated " + hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hrs / 24);
    return "updated " + days + (days === 1 ? " day ago" : " days ago");
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- fixed content ---------- */
  var HABITS = [
    { id: "move",  name: "Movement",     sub: "Exercise, a walk, anything physical" },
    { id: "fuel",  name: "Water & food", sub: "Ate properly, drank enough" },
    { id: "sleep", name: "Sleep & wind-down", sub: "Screens down, bed on time" },
    { id: "focus", name: "Focused work block", sub: "One uninterrupted stretch" }
  ];

  var MARKETS = [
    { id: "djia",   name: "Dow Jones",  sym: "DJIA" },
    { id: "nasdaq", name: "Nasdaq",     sym: "IXIC" },
    { id: "nzx50",  name: "NZX 50",     sym: "NZ50" },
    { id: "asx200", name: "ASX 200",    sym: "XJO" },
    { id: "btc",    name: "Bitcoin",    sym: "BTC" },
    { id: "xrp",    name: "XRP",        sym: "XRP" },
    { id: "eth",    name: "Ethereum",   sym: "ETH" },
    { id: "gold",   name: "Gold",       sym: "XAU" },
    { id: "silver", name: "Silver",     sym: "XAG" }
  ];

  /* ---------- storage ---------- */
  var PATHS = {
    tasks:    "dashboard/tasks",
    schedule: "dashboard/schedule",
    habits:   "dashboard/habits",
    markets:  "dashboard/markets"
  };

  function blankTasks(day) { return { day: day, top: [null, null, null], list: [], doneYesterday: 0 }; }
  function blankSchedule(day) { return { day: day, events: [] }; }
  function blankHabits() { return { days: {} }; }
  function blankMarkets() { return { items: {}, updatedAt: null }; }

  var store = {
    db: null,
    timers: {},
    pending: {},
    onError: null,
    ready: false
  };

  function flush(key) {
    var value = store.pending[key];
    delete store.pending[key];
    delete store.timers[key];
    if (!store.db || value === undefined) return;
    store.db.doc(PATHS[key]).set(value).catch(function (e) {
      if (store.onError) store.onError(e);
    });
  }
  function save(key, value) {
    if (!store.ready) return;
    store.pending[key] = value;
    if (store.timers[key]) clearTimeout(store.timers[key]);
    store.timers[key] = setTimeout(function () { flush(key); }, 350);
  }
  function flushAll() {
    Object.keys(store.timers).forEach(function (k) {
      clearTimeout(store.timers[k]); flush(k);
    });
  }
  window.addEventListener("pagehide", flushAll);
  window.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushAll();
  });

  function readDoc(key, fallback) {
    if (!store.db) return Promise.resolve(fallback);
    return store.db.doc(PATHS[key]).get().then(function (snap) {
      if (!snap.exists) return fallback;
      var data = snap.data();
      return data && typeof data === "object" ? data : fallback;
    });
  }

  /* ---------- rollover ---------- */
  function rollTasks(t, today) {
    if (!t || t.day === today) return t;
    var doneCount = 0;
    var top = (t.top || [null, null, null]).map(function (slot) {
      if (!slot) return null;
      if (slot.done) { doneCount++; return null; }
      return slot;
    });
    var list = (t.list || []).filter(function (task) {
      if (task.done) { doneCount++; return false; }
      return true;
    });
    while (top.length < 3) top.push(null);
    return { day: today, top: top, list: list, doneYesterday: doneCount };
  }
  function rollSchedule(s, today) {
    if (!s || s.day === today) return s;
    return { day: today, events: [] };
  }
  function pruneHabits(hb, today) {
    var keep = {};
    for (var i = 0; i < 30; i++) keep[shiftKey(today, -i)] = true;
    var out = {};
    Object.keys(hb.days || {}).forEach(function (k) { if (keep[k]) out[k] = hb.days[k]; });
    return { days: out };
  }

  /* ---------- small components ---------- */
  function Check(props) {
    return div({ className: "check" + (props.on ? " on" : ""), "aria-hidden": "true" }, icon(I_CHECK, 16));
  }

  function Eyebrow(props) {
    return div({ className: "eyebrow" },
      span(null, props.title),
      props.hint ? span({ className: "hint" }, props.hint) : null
    );
  }

  /* ---------- swipeable task row ---------- */
  function TaskRow(props) {
    var task = props.task;
    var ref = useRef(null);
    var start = useRef(0);
    var moved = useRef(false);
    var draggingRef = useRef(false);
    var offsetRef = useRef(0);
    var st = useState(0), offset = st[0], setOffset = st[1];

  function normTasks(v, day) {

    while (top.length < 3) top.push(null);

    });

    });

      day: typeof v.day === "string" ? v.day : day,

    });

      items[m.id] = {

        change: row && row.change != null ? String(row.change) : ""
      };
    });
    return { items: items, updatedAt: typeof v.updatedAt === "string" ? v.updatedAt : null };
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
