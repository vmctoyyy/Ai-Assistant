<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiet Desk</title>
<meta name="description" content="A personal daily dashboard: three priorities, a task list, today's schedule, four habits and your market prices.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF6F0">
<meta name="color-scheme" content="light">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiet Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="icon" href="icons/icon-192.png">

<style>
/* Newsreader carries the date and the Top 3. Everything else uses the
   platform's own faces, which are already on the phone: SF Pro and SF Mono
   on iOS, with real fallbacks elsewhere. */
@font-face{
  font-family:"Newsreader";
  src:url("assets/newsreader-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}

:root{
  color-scheme:light;
  --ground:#FAF6F0;        /* warm off-white, never pure white */
  --surface:#FFFCF7;
  --surface-2:#F3ECE2;
  --ink:#3B352E;
  --ink-2:#6E655A;
  --ink-3:#A2988B;
  --line:#EDE5DA;
  --line-2:#DFD5C7;
  --accent:#8A7A67;        /* warm taupe — the only emphasis, never bright */
  --accent-soft:#F0E8DC;
  --tile-1:#F1E8DB;
  --tile-2:#EDE5DA;
  --tile-3:#F3EBE0;
  --tile-4:#EAE2D5;
  --tile-5:#F6F1E9;
  --tap:52px;
  --bubble-r:30px;
  /* iOS's own curve and timings: ~0.35s for a push or pop, 0.4s for a sheet
     coming up, on a decelerating ease that starts fast and settles. */
  --ease-ios:cubic-bezier(.32,.72,0,1);
  --t-screen:340ms;
  --t-sheet:400ms;
  --wrap:34rem;
  --serif:"Newsreader",ui-serif,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{
  background:none;border:0;padding:0;cursor:pointer;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
}
input,textarea{font-size:16px}   /* keeps iOS from zooming on focus */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.page{
  max-width:var(--wrap);
  margin:0 auto;
  padding:1.5rem 1.125rem 2rem;
  display:flex;flex-direction:column;gap:2rem;
}

/* header */
.head{display:flex;flex-direction:column;gap:.15rem}
.head .wd{font-size:.75rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.head .dt{font-family:var(--serif);font-size:2.125rem;font-weight:400;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}

/* sections */
.sec{display:flex;flex-direction:column;gap:.875rem}
.eyebrow{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  font-size:.6875rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);padding-bottom:.5rem;border-bottom:1px solid var(--line);
}
.eyebrow .hint{font-weight:400;letter-spacing:.06em;text-transform:none;font-size:.75rem}

/* top 3 */
.top3{display:flex;flex-direction:column;gap:.5rem}
.slot{
  display:flex;align-items:center;gap:.875rem;
  min-height:76px;padding:.75rem .875rem;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  transition:background .15s ease,border-color .15s ease;
}
.slot.empty{background:transparent;border-style:dashed;border-color:var(--line-2)}
.slot .body{flex:1;min-width:0;text-align:left}
.slot .txt{font-family:var(--serif);font-size:1.1875rem;line-height:1.3;overflow-wrap:anywhere}
.slot.done .txt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.slot .prompt{color:var(--ink-3);font-size:.9375rem;font-style:italic;font-family:var(--serif)}
.slot .rank{font-family:var(--mono);font-size:.6875rem;color:var(--ink-3);width:1ch;flex:none}

.check{
  flex:none;width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--line-2);display:grid;place-items:center;
  transition:border-color .15s ease,background .15s ease;
}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{opacity:0;color:var(--ground)}
.check.on svg{opacity:1}
.tapzone{display:flex;align-items:center;gap:.875rem;flex:1;min-width:0;text-align:left;min-height:var(--tap)}

/* task list */
.tasks{display:flex;flex-direction:column}
.rowwrap{position:relative;overflow:hidden}
.rowwrap::after{
  content:"Delete";position:absolute;inset:0 1rem 0 auto;display:flex;align-items:center;
  font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--down);
  opacity:0;pointer-events:none;
}
.rowwrap.sliding::after{opacity:1}
.row{
  position:relative;background:var(--surface);
  display:flex;align-items:center;gap:.25rem;
  padding:.5rem 0;border-bottom:1px solid var(--line);touch-action:pan-y;
}
.tickbtn{
  flex:none;display:grid;place-items:center;
  min-width:46px;min-height:var(--tap);
}
.rowbody{
  flex:1;min-width:0;display:flex;align-items:center;
  text-align:left;min-height:var(--tap);padding-right:.25rem;
}
.row .txt{font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.row.done .txt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.iconbtn{
  flex:none;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-3);transition:color .15s ease,background .15s ease;
}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.empty-note{color:var(--ink-3);font-family:var(--serif);font-style:italic;font-size:.9375rem;padding:.75rem 0;margin:0}
.tally{font-size:.8125rem;color:var(--ink-3);padding-top:.75rem;margin:0;font-variant-numeric:tabular-nums}

/* ---- shared controls (used by every remaining app) ---- */
.field{
  background:var(--ground);border:1px solid var(--line);border-radius:12px;
  padding:.6875rem .875rem;min-height:48px;width:100%;color:var(--ink);
  transition:border-color .18s ease, box-shadow .18s ease;
}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:none;border-color:var(--line-2);box-shadow:0 0 0 3px var(--accent-soft)}
.field.stamp{width:auto;flex:1;min-width:0;font-family:var(--mono);min-height:44px}
.btn{
  background:var(--ground);border:1px solid var(--line-2);border-radius:12px;
  padding:.625rem 1rem;min-height:48px;
  font-size:.875rem;font-weight:500;color:var(--ink-2);white-space:nowrap;
  transition:opacity .18s ease, transform .18s ease;
}
.btn:active{transform:scale(.98);opacity:.82}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FFFCF7;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:active{transform:none;opacity:.45}
.disc{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  width:100%;min-height:var(--tap);text-align:left;
}
.disc .lbl{font-size:.9375rem}
.meta{font-size:.75rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chev{color:var(--ink-3);transition:transform .18s ease;flex:none;display:flex}
.chev.open{transform:rotate(180deg)}

/* composer */
.composer{
  flex:none;background:var(--surface);
  border-top:1px solid var(--line);
  border-radius:0 0 var(--bubble-r) var(--bubble-r);
  padding:.75rem 1.125rem .875rem;
}
.composer .inner{max-width:var(--wrap);margin:0 auto;display:flex;gap:.5rem;align-items:center}
.composer .btn{flex:none;padding-left:.875rem;padding-right:.875rem}
/* A faded solid reads as broken. Empty input just means "not yet". */
.composer .btn.primary:disabled{
  background:transparent;border-color:var(--line-2);color:var(--ink-3);opacity:1;
}
.composer .field{flex:1 1 auto;min-width:0}
/* On the narrowest phones the three controls stop fitting side by side,
   so the input takes its own row and the buttons share the one below. */
@media (max-width:23rem){
  .composer .inner{flex-wrap:wrap}
  .composer .field{flex:1 0 100%}
  .composer .dumpbtn{margin-right:auto}
}

/* sheets */
.scrim{
  position:fixed;inset:0;z-index:40;
  background:rgba(74,58,40,.28);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;
  padding:.5rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px));
  animation:scrimIn 240ms ease-out both;
}
.sheet{
  background:var(--surface);width:100%;max-width:var(--wrap);
  border-radius:var(--bubble-r);border:0;
  box-shadow:0 2px 6px rgba(90,72,50,.08), 0 16px 40px rgba(90,72,50,.12);
  animation:sheetUp var(--t-sheet) var(--ease-ios) both;
  padding:1.25rem 1.125rem 1.25rem;
  display:flex;flex-direction:column;gap:.875rem;
  max-height:88dvh;overflow:hidden;
}
/* The body scrolls; the actions are a flex sibling that never moves.
   Deliberately not position:sticky inside the scroller — that combination
   mis-hit-tests on iOS Safari. */
.sheetbody{
  flex:0 1 auto;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;gap:.875rem;
}
.sheet h2{margin:0;font-family:var(--serif);font-size:1.375rem;font-weight:400}
.sheet p{margin:0;font-size:.875rem;color:var(--ink-2)}
.sheet textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:.875rem;min-height:32vh;resize:none;line-height:1.6;width:100%;
}
.sheet textarea.code{font-family:var(--mono);font-size:.75rem;line-height:1.5;min-height:22vh}
.sheet textarea.short{min-height:16vh}
.preview{display:flex;flex-direction:column;gap:.5rem}
.pv{
  display:flex;flex-direction:column;gap:.3125rem;
  padding:.625rem .75rem;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;
}
.pv-title{font-size:.9375rem;line-height:1.35;overflow-wrap:anywhere}
.pv-meta{display:flex;gap:.375rem;flex-wrap:wrap}
.pv-tag{
  font-size:.6875rem;color:var(--ink-3);
  border:1px solid var(--line);border-radius:999px;padding:.125rem .4375rem;
}
.pv-tag.when{
  font-family:var(--mono);color:var(--accent);border-color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.pv-note{font-size:.75rem;color:var(--ink-2);line-height:1.45;overflow-wrap:anywhere}
.sheet textarea:focus{outline:none;border-color:var(--accent)}
.sheetfoot{
  flex:none;display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;
  padding-top:.875rem;border-top:1px solid var(--line);
}

/* footer */
.foot{display:flex;flex-direction:column;gap:.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.foot .note{font-size:.75rem;color:var(--ink-3);line-height:1.55;margin:0}
.foot .build{display:block;margin-top:.375rem;font-family:var(--mono);font-size:.6875rem;color:var(--ink-3);opacity:.7}
.footrow{display:flex;gap:1.25rem;flex-wrap:wrap;align-items:center}
.linkbtn{
  font-size:.8125rem;color:var(--ink-3);text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--line-2);min-height:44px;
}
.linkbtn:hover{color:var(--accent);text-decoration-color:var(--accent)}
.linkbtn.danger:hover,.linkbtn.armed{color:var(--down);text-decoration-color:var(--down)}

/* states */
.banner{
  background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  padding:.75rem .875rem;font-size:.8125rem;color:var(--ink-2);line-height:1.5;
  display:flex;gap:.75rem;align-items:flex-start;
}
.banner .x{flex:none;color:var(--ink-3);width:24px;height:24px;display:grid;place-items:center}
.skel{display:flex;flex-direction:column;gap:.75rem}
.skel i{display:block;border-radius:4px;background:var(--surface-2);animation:pulse 1.6s ease-in-out infinite}
.skel .line{height:14px;width:100%}
.skel .line:nth-child(2){width:70%;animation-delay:.12s}
.skel .line:nth-child(3){width:45%;animation-delay:.24s}
.skel .big{height:76px;border-radius:12px;width:100%}
.skel .big:nth-child(2){animation-delay:.12s}
.skel .big:nth-child(3){animation-delay:.24s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.loadwrap{
  max-width:var(--wrap);margin:0 auto;
  padding:calc(1.75rem + env(safe-area-inset-top,0px)) 1.125rem 2rem;
  display:flex;flex-direction:column;gap:2rem;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- morning brief ---- */
.head{position:relative}
.briefLink{
  position:absolute;top:.35rem;right:0;
  font-size:.75rem;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);
  min-height:44px;display:flex;align-items:flex-start;padding-top:.35rem;
}
.briefLink:hover{color:var(--accent);text-decoration-color:var(--accent)}
.brief{gap:1.75rem}
.greeting{
  margin:0;font-size:1rem;color:var(--ink-2);
}
.starthere{
  margin:0;font-family:var(--serif);font-size:1.3125rem;line-height:1.4;
  text-wrap:pretty;
}
.sh-title{font-style:italic}
.seclead{margin:0 0 .25rem;font-size:.8125rem;color:var(--ink-3);line-height:1.5}
.planadvice{
  margin:-1.25rem 0 0;font-size:.9375rem;line-height:1.5;color:var(--ink-2);
}
.planadvice .sh-title{color:var(--ink);font-weight:500}
.remindrow{display:flex;flex-direction:column;gap:.4375rem;padding-top:.375rem}
.briefend{display:flex;justify-content:center;padding-top:.5rem}

/* ---- carry-ins ---- */
.carrysec .tasks{
  border-left:2px solid var(--line-2);padding-left:.875rem;margin-left:.0625rem;
}
.carrytag{
  display:block;font-size:.6875rem;color:var(--ink-3);margin-top:.15rem;
  letter-spacing:.02em;
}
.notes{display:block;font-size:.75rem;color:var(--ink-3);margin-top:.15rem;line-height:1.45}
.mustdot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin-right:.5rem;vertical-align:.18em;flex:none;
}

/* ---- chips ---- */
.chips{display:flex;gap:.375rem;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);border-radius:999px;
  padding:.3125rem .75rem;min-height:34px;
  font-size:.8125rem;color:var(--ink-3);background:var(--surface);
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.chip:hover{color:var(--ink-2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.compchips{
  display:flex;flex-direction:column;gap:.375rem;
  max-width:var(--wrap);margin:0 auto .5rem;
}
.sheetfield{display:flex;flex-direction:column;gap:.4375rem}
.fieldlabel{
  font-size:.6875rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.fieldnote{font-size:.75rem;color:var(--ink-3)}
.sheetfoot.spread{justify-content:space-between;align-items:center}
.togglerow{display:flex;align-items:center;gap:.75rem;min-height:48px}
.togglebtn{display:flex;align-items:center;gap:.625rem;min-height:48px;flex:none}
.tick{
  width:22px;height:22px;border-radius:6px;flex:none;
  border:1.5px solid var(--line-2);display:grid;place-items:center;
  transition:background .15s ease,border-color .15s ease;
}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick svg{opacity:0;color:var(--ground)}
.tick.on svg{opacity:1}
.ticklabel{font-size:.9375rem;color:var(--ink-2)}
.togglebtn[aria-checked="true"] .ticklabel{color:var(--ink)}
.field.stamp{width:auto;flex:1;min-width:0;font-family:var(--mono);min-height:44px}
.addedline{
  margin:.25rem 0 0;font-size:.75rem;color:var(--ink-3);
}
.duetag{
  display:block;font-size:.75rem;color:var(--ink-2);margin-top:.15rem;
  font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.01em;
}

/* ---- suggestions & stale prompt ---- */
.suggest{
  display:flex;flex-direction:column;gap:.625rem;
  padding:.875rem;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;margin-bottom:.5rem;
}
.suggest.stale{border-style:dashed}
.sg-title{font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.sg-meta{margin:0;font-size:.75rem;color:var(--ink-3)}
.sg-acts{display:flex;gap:.5rem;flex-wrap:wrap}
.btn.small{min-height:40px;padding:.4375rem .75rem;font-size:.8125rem}

/* ---- home ---- */
.home{
  height:100dvh;height:100vh;
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
.home-head{
  flex:0 0 25%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.75rem;
  padding:0 2rem;text-align:center;
}
.hh-date{
  font-family:var(--serif);font-size:1.875rem;font-weight:400;
  letter-spacing:-.01em;color:var(--ink);line-height:1.1;
}
.hh-quote{
  font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:.9375rem;line-height:1.65;color:var(--ink-3);
  max-width:26rem;text-wrap:pretty;
}
.home-grid{
  flex:1 1 75%;display:grid;
  grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);
  gap:clamp(1rem,6vw,2.5rem);
  padding:clamp(1.25rem,7vw,3rem) clamp(1.5rem,10vw,4rem) clamp(2rem,9vw,3.5rem);
  place-items:center;min-height:0;
}
.tile{
  width:100%;max-width:112px;aspect-ratio:1;
  border:0;border-radius:26%;
  display:grid;place-items:center;
  color:var(--ink-2);
  box-shadow:0 1px 2px rgba(90,72,50,.05), 0 6px 16px rgba(90,72,50,.045);
  transition:transform .22s var(--ease-ios), opacity .22s var(--ease-ios);
}
.tile.tone1{background:var(--tile-1)}
.tile.tone2{background:var(--tile-2)}
.tile.tone3{background:var(--tile-3)}
.tile.tone4{background:var(--tile-4)}
.tile.tone5{background:var(--tile-5);box-shadow:none;color:var(--ink-3);opacity:.55}
.tile:not(.placeholder):active{transform:scale(.955);opacity:.85}
.tile-art{width:44%;height:44%}
.home-warn{
  flex:none;margin:0 1.5rem 1rem;padding:.75rem .875rem;
  background:var(--surface);border-radius:12px;
  font-size:.8125rem;color:var(--ink-2);line-height:1.5;
  box-shadow:0 1px 2px rgba(90,72,50,.05);
}

/* ---- app screens ---- */
/* An app opens as a soft bubble resting on the page, not a full-bleed sheet
   with hard viewport corners. The bubble is the scroll container. */
.screen{
  height:100dvh;height:100vh;
  display:flex;
  padding:calc(.5rem + env(safe-area-inset-top,0px)) .5rem
          calc(.5rem + env(safe-area-inset-bottom,0px));
}
.bubble{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--surface);
  border-radius:var(--bubble-r);
  overflow:hidden;
  box-shadow:0 1px 2px rgba(90,72,50,.05), 0 10px 30px rgba(90,72,50,.07);
}
/* An app comes forward from its icon; screens inside it push and pop
   sideways; home settles back in behind. */
@keyframes screenOpen{ from{opacity:0;transform:scale(.955)} to{opacity:1;transform:scale(1)} }
@keyframes screenPush{ from{opacity:0;transform:translateX(9%)}  to{opacity:1;transform:translateX(0)} }
@keyframes screenPop { from{opacity:0;transform:translateX(-7%)} to{opacity:1;transform:translateX(0)} }
@keyframes homeIn   { from{opacity:0;transform:scale(1.03)}      to{opacity:1;transform:scale(1)} }
@keyframes sheetUp  { from{transform:translateY(100%)}           to{transform:translateY(0)} }
@keyframes scrimIn  { from{opacity:0} to{opacity:1} }
.a-open{animation:screenOpen var(--t-screen) var(--ease-ios) both}
.a-push{animation:screenPush var(--t-screen) var(--ease-ios) both}
.a-pop {animation:screenPop  var(--t-screen) var(--ease-ios) both}
.a-in  {animation:homeIn     var(--t-screen) var(--ease-ios) both}
.screen-top{
  flex:none;background:var(--surface);
  display:flex;align-items:center;gap:.75rem;
  padding:.875rem 1.125rem .625rem;
}
.backbtn{
  display:flex;align-items:center;gap:.25rem;
  min-height:44px;padding-right:.5rem;
  font-size:.9375rem;color:var(--ink-2);
  transition:opacity .18s ease;
}
.backbtn:active{opacity:.6}
.screen-title{
  font-family:var(--serif);font-size:1.0625rem;color:var(--ink-3);
}
.screen-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.screen-body > .page{padding-top:.5rem}

/* ---- quotes ---- */
.quote-today{
  margin:0 1.125rem 1.5rem;padding:1.5rem 1.375rem;
  background:var(--ground);border-radius:20px;
  box-shadow:0 1px 2px rgba(90,72,50,.05), 0 8px 20px rgba(90,72,50,.04);
  display:flex;flex-direction:column;gap:.5rem;
}
.qt-text{font-family:var(--serif);font-style:italic;font-weight:300;font-size:1.1875rem;line-height:1.55;color:var(--ink)}
.qt-source{font-size:.8125rem;color:var(--ink-3)}
.qt-label{
  font-size:.625rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);padding-top:.25rem;
}
.quote-add{display:flex;flex-direction:column;gap:.5rem;margin:0 1.125rem 1.25rem}
.quote-add-row{display:flex;gap:.5rem}
.quote-add-row .field{flex:1;min-width:0}
.quote-add-row .btn{flex:none}
.quote-note{
  margin:0 1.125rem 1.25rem;padding:.875rem 1rem;
  background:var(--surface-2);border-radius:14px;
  display:flex;flex-direction:column;gap:.625rem;align-items:flex-start;
}
.quote-note p{margin:0;font-size:.8125rem;color:var(--ink-2);line-height:1.5}
.quote-list{display:flex;flex-direction:column;padding:0 1.125rem 2rem}
.quote-row{
  display:flex;align-items:flex-start;gap:.5rem;
  padding:.875rem 0;border-bottom:1px solid var(--line);
}
.qr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.qr-text{font-family:var(--serif);font-size:1rem;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.qr-source{font-size:.75rem;color:var(--ink-3)}

/* ---- recap ---- */
.recap-lead{margin:0 1.125rem 1.5rem;font-size:.9375rem;color:var(--ink-2);line-height:1.5}
.screen-body > .sec{padding:0 1.125rem;margin-bottom:1.5rem}
.recap-day{display:flex;flex-direction:column}
.recap-row{display:flex;align-items:flex-start;gap:.625rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
.recap-tick{color:var(--accent);display:flex;padding-top:.15rem;flex:none}
.recap-title{flex:1;min-width:0;font-size:.9375rem;line-height:1.4;color:var(--ink-2);overflow-wrap:anywhere}

/* ---- shopping ---- */
.shop-add{display:flex;gap:.5rem;padding:0 1.125rem 1.25rem}
.shop-add .field{flex:1;min-width:0}
.shop-add .btn{flex:none}
.screen-body > .tasks,
.screen-body > .empty-note{padding:0 1.125rem}
.shop-name .txt{font-size:1rem}

/* ---- shopping carts ---- */
.carts-top{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:0 1.125rem 1.25rem;
}
.btn.wide{flex:1;justify-content:center;display:flex;align-items:center}
.cart-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:.875rem;
  padding:0 1.125rem 2rem;
}
.cart-bubble{
  position:relative;border-radius:20px;padding:4px;
  box-shadow:0 1px 2px rgba(90,72,50,.05), 0 6px 16px rgba(90,72,50,.06);
  transition:transform .22s var(--ease-ios), opacity .22s var(--ease-ios);
}
.cart-bubble:active{transform:scale(.98)}
.cart-open{display:block;width:100%;text-align:left}
.cart-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;
  padding:.5rem .625rem .5rem;
}
.cart-shop{
  font-family:var(--serif);font-size:1rem;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cart-count{font-size:.6875rem;opacity:.85;font-variant-numeric:tabular-nums;flex:none}
.cart-inner{
  background:var(--surface);border-radius:16px;
  padding:.625rem .6875rem;min-height:88px;
  display:flex;flex-direction:column;gap:.25rem;
}
.cart-line{
  font-size:.8125rem;line-height:1.35;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cart-line.empty{color:var(--ink-3);font-style:italic}
.cart-menu{
  position:absolute;top:2px;right:2px;
  width:34px;height:34px;display:grid;place-items:center;opacity:.75;
}
.cart-menu:active{opacity:1}

/* full-screen cart */
.cart-full{background:var(--surface)}
.cart-banner{
  flex:none;display:flex;align-items:center;gap:.5rem;
  padding:.75rem .75rem .75rem 1rem;
}
.cart-banner .backbtn{min-height:40px}
.cart-banner-name{
  flex:1;min-width:0;text-align:center;
  font-family:var(--serif);font-size:1.0625rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cart-pad{padding:1.25rem 1.125rem 1.5rem}

/* colour picking */
.colour-field{display:flex;align-items:center;gap:.625rem}
.swatch{
  width:26px;height:26px;border-radius:9px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(90,72,50,.12);
}
.swatch.big{width:32px;height:32px;border-radius:11px}
.colour-input{
  width:52px;height:40px;padding:2px;border:1px solid var(--line);
  border-radius:10px;background:var(--ground);
}
.colour-hex{font-family:var(--mono);font-size:.75rem;color:var(--ink-3)}
.shop-chips{display:flex;flex-wrap:wrap;gap:.4375rem}
.shop-chip{
  border-radius:999px;padding:.4375rem .875rem;min-height:38px;
  font-size:.8125rem;font-weight:500;
  transition:transform .18s ease;
}
.shop-chip:active{transform:scale(.97)}
.shop-new{display:flex;flex-direction:column;gap:.625rem;margin-bottom:1.75rem}
.shop-new-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.shop-list{display:flex;flex-direction:column}
.shop-row{
  display:flex;align-items:center;gap:.75rem;
  padding:.75rem 0;border-bottom:1px solid var(--line);min-height:var(--tap);
}
.shop-name{flex:1;min-width:0;font-size:.9375rem;overflow-wrap:anywhere}
.shop-edit{display:flex;flex-direction:column;gap:.625rem;width:100%}

/* the heavier confirmation */
.confirm-body{display:flex;flex-direction:column;gap:.5rem;padding:.25rem 0 .5rem}
.confirm-lead{margin:0;font-family:var(--serif);font-size:1.0625rem;line-height:1.5;color:var(--ink)}
.confirm-detail{margin:0;font-size:.8125rem;color:var(--ink-3)}
.btn.danger{
  background:#8a5f52;border-color:#8a5f52;color:#fffcf7;font-weight:600;
}
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
